<!-- LÓGICA JAVASCRIPT CON CORREO VISIBLE EN PERSONAL -->
    <script>
        const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbwqYwIBI4AkNpNGXF1QhYUw1kthGGx0tVQOZsHHT5KwovDx_5S6z_ESaO8Eb80gaBiO/exec";

        function getBackendUrl() {
            return localStorage.getItem('hidrandina_gas_url') || DEFAULT_GAS_URL;
        }

        let appData = {
            Documentos: [],
            Personal: [],
            Estados: [],
            Origenes: [],
            Alarmas: []
        };

        let chartsInstance = { estados: null, origenes: null };

        document.addEventListener('DOMContentLoaded', () => {
            loadLocalCache();
            fetchData();
        });

        function loadLocalCache() {
            if (localStorage.getItem('hidrandina_docs_cache')) appData.Documentos = JSON.parse(localStorage.getItem('hidrandina_docs_cache'));
            if (localStorage.getItem('hidrandina_pers_cache')) appData.Personal = JSON.parse(localStorage.getItem('hidrandina_pers_cache'));
            if (localStorage.getItem('hidrandina_ests_cache')) appData.Estados = JSON.parse(localStorage.getItem('hidrandina_ests_cache'));
            if (localStorage.getItem('hidrandina_orig_cache')) appData.Origenes = JSON.parse(localStorage.getItem('hidrandina_orig_cache'));
            if (localStorage.getItem('hidrandina_alar_cache')) appData.Alarmas = JSON.parse(localStorage.getItem('hidrandina_alar_cache'));
            if (appData.Documentos.length > 0) renderAll();
        }

        function saveLocalCache() {
            localStorage.setItem('hidrandina_docs_cache', JSON.stringify(appData.Documentos));
            localStorage.setItem('hidrandina_pers_cache', JSON.stringify(appData.Personal));
            localStorage.setItem('hidrandina_ests_cache', JSON.stringify(appData.Estados));
            localStorage.setItem('hidrandina_orig_cache', JSON.stringify(appData.Origenes));
            localStorage.setItem('hidrandina_alar_cache', JSON.stringify(appData.Alarmas));
        }

        function setConnectionStatus(status, text) {
            const badge = document.getElementById('connection-badge');
            if (status === 'active') {
                badge.className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800";
                badge.innerHTML = `<span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-emerald-500"></span> ${text}`;
            } else if (status === 'error') {
                badge.className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-100 text-rose-800";
                badge.innerHTML = `<span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-rose-500"></span> ${text}`;
            } else {
                badge.className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800";
                badge.innerHTML = `<span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-amber-500 animate-pulse"></span> ${text}`;
            }
        }

        function getProp(obj, keys) {
            if (!obj) return '';
            if (typeof obj !== 'object') return obj;
            for (let k of keys) {
                if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k];
            }
            return '';
        }

        window.handleGASResponse = function(data) {
            if (data) {
                if (data.Registros) appData.Documentos = data.Registros;
                if (data.Catalogos) {
                    appData.Personal = data.Catalogos.Personal || data.Catalogos.Responsables || appData.Personal;
                    appData.Estados = data.Catalogos.Estados || appData.Estados;
                    appData.Origenes = data.Catalogos.Origenes || appData.Origenes;
                    appData.Alarmas = data.Catalogos.Alarmas || appData.Alarmas;
                }
                saveLocalCache();
                setConnectionStatus('active', 'Sincronizado');
                renderAll();
            }
        };

        function fetchData() {
            setConnectionStatus('sync', 'Conectando...');
            const url = getBackendUrl();
            const oldScript = document.getElementById('jsonp-fetch');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'jsonp-fetch';
            script.src = `${url}?callback=handleGASResponse&_=${new Date().getTime()}`;
            script.onerror = () => { setConnectionStatus('error', 'Offline'); renderAll(); };
            document.body.appendChild(script);
        }

        function executeGASAction(params, successCallback) {
            setConnectionStatus('sync', 'Guardando...');
            const callbackName = 'gasWriteCb_' + Math.floor(Math.random() * 100000);
            window[callbackName] = function(response) {
                delete window[callbackName];
                const s = document.getElementById(callbackName);
                if (s) s.remove();
                if (response && response.success) {
                    setConnectionStatus('active', 'Guardado en Nube');
                    if (successCallback) successCallback(response);
                    fetchData();
                } else {
                    alert("Aviso: " + (response ? response.message : 'Error al guardar'));
                    fetchData();
                }
            };
            const url = getBackendUrl();
            const query = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
            const script = document.createElement('script');
            script.id = callbackName;
            script.src = `${url}?${query}&callback=${callbackName}&_=${new Date().getTime()}`;
            script.onerror = () => { alert("Error de red."); setConnectionStatus('error', 'Error'); };
            document.body.appendChild(script);
        }

        function renderAll() {
            renderTable(appData.Documentos);
            populateSelects();
            renderStats();
            renderCatalogsManagement();
        }

        function calcularPlazos(fechaIngresoStr) {
            if (!fechaIngresoStr) return { vencimiento: '-', diasTranscurridos: 0, diasExceso: 0 };
            const cleanDateStr = String(fechaIngresoStr).split('T')[0];
            const ingreso = new Date(cleanDateStr + 'T00:00:00');
            if (isNaN(ingreso.getTime())) return { vencimiento: '-', diasTranscurridos: 0, diasExceso: 0 };

            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);

            const diffTime = hoy - ingreso;
            const diasTranscurridos = Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));

            let diasLimite = 15;
            if (appData.Alarmas && appData.Alarmas.length > 0) {
                const maxAlarm = appData.Alarmas.reduce((max, a) => Math.max(max, parseInt(getProp(a, ['Dias_Max', 'dias_max', 3]) || 15)), 0);
                if (maxAlarm > 0) diasLimite = maxAlarm;
            }

            const vencimientoDate = new Date(ingreso);
            vencimientoDate.setDate(vencimientoDate.getDate() + diasLimite);
            const vencimientoFormatted = vencimientoDate.toISOString().split('T')[0];

            const diffVenc = hoy - vencimientoDate;
            const diasExceso = Math.max(0, Math.floor(diffVenc / (1000 * 60 * 60 * 24)));

            return { vencimiento: vencimientoFormatted, diasTranscurridos, diasExceso };
        }

        function renderTable(docs) {
            const tbody = document.getElementById('documentosTableBody');
            if (!docs || docs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" class="py-8 text-center text-slate-400">Sin documentos registrados.</td></tr>`;
                return;
            }
            tbody.innerHTML = docs.map((doc, idx) => {
                const numDoc = getProp(doc, ['Numero_Documento', 'numero_documento', 'Numero_Expediente', 'NRO_DOCUMENTO', 1]) || '-';
                const origen = getProp(doc, ['Origen_Tipo', 'origen_tipo', 'ORIGEN', 'Origen', 2]) || '-';
                const asunto = getProp(doc, ['Asunto', 'asunto', 'ASUNTO', 3]) || '-';
                const fechaIngRaw = getProp(doc, ['Fecha_Ingreso', 'fecha_ingreso', 'FECHA_INGRESO', 4]) || '';
                const fechaIng = fechaIngRaw ? String(fechaIngRaw).split('T')[0] : '-';

                const plazos = calcularPlazos(fechaIng);

                const rawVenc = getProp(doc, ['Fecha_Vencimiento', 'fecha_vencimiento', 5]);
                const fechaVenc = (rawVenc && rawVenc !== 'NaN-aN-aN' && !String(rawVenc).match(/[a-zA-Z]/)) ? String(rawVenc).split('T')[0] : plazos.vencimiento;

                const rawTrans = getProp(doc, ['Dias_Trancurridos', 'dias_trancurridos', 'Dias_Transcurridos', 6]);
                const diasTrans = (rawTrans !== undefined && rawTrans !== '' && !isNaN(rawTrans)) ? parseInt(rawTrans) : plazos.diasTranscurridos;

                const rawExc = getProp(doc, ['Dias_Exceso', 'dias_exceso', 7]);
                const diasExc = (rawExc !== undefined && rawExc !== '' && !isNaN(rawExc)) ? parseInt(rawExc) : plazos.diasExceso;

                const responsable = getProp(doc, ['Responsable', 'responsable', 'RESPONSABLE', 8]) || '-';
                const estado = getProp(doc, ['Estado', 'estado', 'ESTADO', 9]) || '-';
                const observaciones = getProp(doc, ['Observaciones', 'observaciones', 'OBSERVACIONES', 10]) || '-';
                const isConcluido = String(estado).toLowerCase().includes('atendido') || String(estado).toLowerCase().includes('concluido');

                return `
                    <tr class="hover:bg-slate-50/80 transition">
                        <td class="py-3 px-3 font-semibold text-slate-900">${numDoc}</td>
                        <td class="py-3 px-3 text-slate-600"><span class="px-2.5 py-1 rounded-full text-[10px] font-medium bg-slate-100 text-slate-700">${origen}</span></td>
                        <td class="py-3 px-3 text-slate-800 max-w-[180px] truncate" title="${asunto}">${asunto}</td>
                        <td class="py-3 px-3 text-slate-500">${fechaIng}</td>
                        <td class="py-3 px-3 font-medium text-slate-700">${fechaVenc}</td>
                        <td class="py-3 px-3 text-center"><span class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 font-semibold">${diasTrans} días</span></td>
                        <td class="py-3 px-3 text-center">
                            ${diasExc > 0 && !isConcluido ? 
                                `<span class="px-2 py-0.5 rounded bg-rose-100 text-rose-700 font-bold animate-pulse">+${diasExc} días</span>` : 
                                `<span class="text-emerald-600 font-medium">0 días</span>`
                            }
                        </td>
                        <td class="py-3 px-3 text-slate-700 font-medium">${responsable}</td>
                        <td class="py-3 px-3"><span class="px-2.5 py-1 rounded-full text-[10px] font-semibold bg-blue-100 text-blue-800">${estado}</span></td>
                        <td class="py-3 px-3 text-slate-600 max-w-[150px] truncate" title="${observaciones}">${observaciones}</td>
                        <td class="py-3 px-3 text-right space-x-1">
                            <button onclick="editDocument(${idx})" class="p-1.5 text-slate-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition" title="Editar"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteDocument(${idx})" class="p-1.5 text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function populateSelects() {
            const estSel = document.getElementById('filterEstado');
            const origSel = document.getElementById('filterOrigen');
            const currentEst = estSel.value;
            const currentOrig = origSel.value;

            const estadosNombres = appData.Estados.map(e => typeof e === 'object' ? getProp(e, ['Nombre_Estado', 'Estado', 1]) : e).filter(Boolean);
            const origenesNombres = appData.Origenes.map(o => typeof o === 'object' ? getProp(o, ['Tipo_Origen', 'Origen', 1]) : o).filter(Boolean);
            const personalNombres = appData.Personal.map(p => typeof p === 'object' ? getProp(p, ['Nombre_Completo', 'Nombre', 1]) : p).filter(Boolean);

            estSel.innerHTML = '<option value="">Todos los Estados</option>' + estadosNombres.map(e => `<option value="${e}">${e}</option>`).join('');
            origSel.innerHTML = '<option value="">Todos los Orígenes</option>' + origenesNombres.map(o => `<option value="${o}">${o}</option>`).join('');
            estSel.value = currentEst;
            origSel.value = currentOrig;

            document.getElementById('formOrigenTipo').innerHTML = origenesNombres.map(o => `<option value="${o}">${o}</option>`).join('');
            document.getElementById('formResponsable').innerHTML = personalNombres.map(p => `<option value="${p}">${p}</option>`).join('');
            document.getElementById('formEstado').innerHTML = estadosNombres.map(e => `<option value="${e}">${e}</option>`).join('');
        }

        function filterDocuments() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const estado = document.getElementById('filterEstado').value;
            const origen = document.getElementById('filterOrigen').value;

            const filtered = appData.Documentos.filter(doc => {
                const numDoc = String(getProp(doc, ['Numero_Documento', 'Numero_Expediente', 1]) || '').toLowerCase();
                const asunto = String(getProp(doc, ['Asunto', 3]) || '').toLowerCase();
                const resp = String(getProp(doc, ['Responsable', 8]) || '').toLowerCase();
                const docEstado = String(getProp(doc, ['Estado', 9]) || '');
                const docOrigen = String(getProp(doc, ['Origen_Tipo', 2]) || '');
                return (numDoc.includes(query) || asunto.includes(query) || resp.includes(query)) && (!estado || docEstado === estado) && (!origen || docOrigen === origen);
            });
            renderTable(filtered);
        }

        function renderStats() {
            document.getElementById('stat-total').innerText = appData.Documentos.length;
            let tramite = 0, atendido = 0, evaluacion = 0;
            appData.Documentos.forEach(doc => {
                const est = String(getProp(doc, ['Estado', 9]) || '').toLowerCase();
                if (est.includes('tramit')) tramite++;
                if (est.includes('atendido') || est.includes('concluido')) atendido++;
                if (est.includes('evaluacion') || est.includes('evaluación')) evaluacion++;
            });
            document.getElementById('stat-tramite').innerText = tramite;
            document.getElementById('stat-atendido').innerText = atendido;
            document.getElementById('stat-evaluacion').innerText = evaluacion;
        }

        function openDocFormModal(idx = null) {
            document.getElementById('docForm').reset();
            populateSelects();
            if (idx !== null) {
                const doc = appData.Documentos[idx];
                document.getElementById('docModalTitle').innerText = "Editar Documento";
                document.getElementById('docIndex').value = idx;
                document.getElementById('formNumeroDocumento').value = getProp(doc, ['Numero_Documento', 'Numero_Expediente', 1]) || '';
                document.getElementById('formOrigenTipo').value = getProp(doc, ['Origen_Tipo', 2]) || '';
                document.getElementById('formAsunto').value = getProp(doc, ['Asunto', 3]) || '';
                document.getElementById('formFechaIngreso').value = String(getProp(doc, ['Fecha_Ingreso', 4]) || '').split('T')[0];
                document.getElementById('formResponsable').value = getProp(doc, ['Responsable', 8]) || '';
                document.getElementById('formEstado').value = getProp(doc, ['Estado', 9]) || '';
                document.getElementById('formObservaciones').value = getProp(doc, ['Observaciones', 10]) || '';
            } else {
                document.getElementById('docModalTitle').innerText = "Nuevo Documento";
                document.getElementById('docIndex').value = "";
                document.getElementById('formFechaIngreso').value = new Date().toISOString().split('T')[0];
            }
            document.getElementById('docFormModal').classList.remove('hidden');
        }

        function closeDocFormModal() { document.getElementById('docFormModal').classList.add('hidden'); }

        function saveDocument(e) {
            e.preventDefault();
            const numDoc = document.getElementById('formNumeroDocumento').value.trim();
            const fechaIng = document.getElementById('formFechaIngreso').value;
            const origenTipo = document.getElementById('formOrigenTipo').value;
            const asunto = document.getElementById('formAsunto').value;
            const resp = document.getElementById('formResponsable').value;
            const est = document.getElementById('formEstado').value;
            const obs = document.getElementById('formObservaciones').value;
            const plazos = calcularPlazos(fechaIng);

            const newDocObj = {
                Numero_Documento: numDoc,
                Origen_Tipo: origenTipo,
                Asunto: asunto,
                Fecha_Ingreso: fechaIng,
                Fecha_Vencimiento: plazos.vencimiento,
                Dias_Trancurridos: plazos.diasTranscurridos,
                Dias_Exceso: plazos.diasExceso,
                Responsable: resp,
                Estado: est,
                Observaciones: obs
            };

            const idx = document.getElementById('docIndex').value;
            if (idx !== "") {
                appData.Documentos[idx] = newDocObj;
            } else {
                appData.Documentos.push(newDocObj);
            }

            saveLocalCache();
            renderAll();
            closeDocFormModal();

            executeGASAction({
                action: "saveDoc",
                ...newDocObj
            });
        }

        function editDocument(idx) { openDocFormModal(idx); }

        function deleteDocument(idx) {
            const doc = appData.Documentos[idx];
            const numDoc = getProp(doc, ['Numero_Documento', 'Numero_Expediente', 1]);
            if (confirm(`¿Eliminar el documento ${numDoc}?`)) {
                appData.Documentos.splice(idx, 1);
                saveLocalCache();
                renderAll();
                executeGASAction({ action: "deleteDoc", Numero_Documento: numDoc });
            }
        }

        function renderCatalogsManagement() {
            // RENDERIZADO DE PERSONAL CON CORREO ELECTRÓNICO VISIBLE
            document.getElementById('managePersonalList').innerHTML = (!appData.Personal || appData.Personal.length === 0) ? '<p class="text-xs text-slate-400 py-2">Sin registros</p>' :
                appData.Personal.map((p, i) => {
                    const nom = typeof p === 'object' ? getProp(p, ['Nombre_Completo', 'Nombre', 1]) : p;
                    const cargo = typeof p === 'object' ? getProp(p, ['Cargo_Area', 'Cargo', 2]) || '' : '';
                    const correo = typeof p === 'object' ? getProp(p, ['Correo_Electronico', 'Correo', 3]) || '' : '';
                    return `<div class="py-2.5 flex justify-between items-center text-xs border-b border-slate-100">
                        <div>
                            <span class="font-semibold text-slate-900">${nom}</span>
                            ${cargo ? '<br><span class="text-slate-600 font-medium">'+cargo+'</span>' : ''}
                            ${correo ? '<br><span class="text-blue-600 text-[11px]"><i class="fa-regular fa-envelope mr-1"></i>'+correo+'</span>' : ''}
                        </div>
                        <div class="space-x-1 flex items-center">
                            <button onclick="editCatalogItem('Personal', ${i})" class="p-1 text-slate-400 hover:text-blue-600 transition" title="Editar"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteCatalogItem('Personal', ${i})" class="p-1 text-slate-400 hover:text-rose-600 transition" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>`;
                }).join('');

            document.getElementById('manageEstadosList').innerHTML = (!appData.Estados || appData.Estados.length === 0) ? '<p class="text-xs text-slate-400 py-2">Sin registros</p>' :
                appData.Estados.map((e, i) => {
                    const nom = typeof e === 'object' ? getProp(e, ['Nombre_Estado', 'Estado', 1]) : e;
                    const col = typeof e === 'object' ? getProp(e, ['Color_Hex', 'Color', 2]) || '#3b82f6' : '#3b82f6';
                    return `<div class="py-2.5 flex justify-between items-center text-xs border-b border-slate-100">
                        <div class="flex items-center space-x-2"><span class="w-3 h-3 rounded-full" style="background-color: ${col}"></span><span class="font-medium text-slate-800">${nom}</span></div>
                        <div class="space-x-1 flex items-center">
                            <button onclick="editCatalogItem('Estados', ${i})" class="p-1 text-slate-400 hover:text-blue-600 transition" title="Editar"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteCatalogItem('Estados', ${i})" class="p-1 text-slate-400 hover:text-rose-600 transition" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>`;
                }).join('');

            document.getElementById('manageOrigenesList').innerHTML = (!appData.Origenes || appData.Origenes.length === 0) ? '<p class="text-xs text-slate-400 py-2">Sin registros</p>' :
                appData.Origenes.map((o, i) => {
                    const tipo = typeof o === 'object' ? getProp(o, ['Tipo_Origen', 'Origen', 1]) : o;
                    return `<div class="py-2.5 flex justify-between items-center text-xs border-b border-slate-100">
                        <span class="font-medium text-slate-800">${tipo}</span>
                        <div class="space-x-1 flex items-center">
                            <button onclick="editCatalogItem('Origenes', ${i})" class="p-1 text-slate-400 hover:text-blue-600 transition" title="Editar"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteCatalogItem('Origenes', ${i})" class="p-1 text-slate-400 hover:text-rose-600 transition" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>`;
                }).join('');

            document.getElementById('manageAlarmasList').innerHTML = (!appData.Alarmas || appData.Alarmas.length === 0) ? '<p class="text-xs text-slate-400 py-2">Sin registros</p>' :
                appData.Alarmas.map((a, i) => {
                    const nom = typeof a === 'object' ? getProp(a, ['Nombre_Alarma', 1]) : a;
                    const min = typeof a === 'object' ? getProp(a, ['Dias_Min', 2]) || 0 : 0;
                    const max = typeof a === 'object' ? getProp(a, ['Dias_Max', 3]) || 0 : 0;
                    const col = typeof a === 'object' ? getProp(a, ['Color_Hex', 4]) || '#ef4444' : '#ef4444';
                    return `<div class="py-2.5 flex justify-between items-center text-xs border-b border-slate-100">
                        <div>
                            <div class="flex items-center space-x-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background-color: ${col}"></span><span class="font-medium text-slate-800">${nom}</span></div>
                            <span class="text-slate-400 text-[10px]">Rango: ${min} - ${max} días</span>
                        </div>
                        <div class="space-x-1 flex items-center">
                            <button onclick="editCatalogItem('Alarmas', ${i})" class="p-1 text-slate-400 hover:text-blue-600 transition" title="Editar"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteCatalogItem('Alarmas', ${i})" class="p-1 text-slate-400 hover:text-rose-600 transition" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>`;
                }).join('');
        }

        function openCatalogModal(type, index = null) {
            document.getElementById('catalogForm').reset();
            document.getElementById('catalogType').value = type;
            document.getElementById('catalogModalTitle').innerText = `Catálogo - ${type}`;

            const lblName = document.getElementById('catalogLabelName');
            const lblSec = document.getElementById('catalogLabelSecondary');
            const secContainer = document.getElementById('catalogFieldSecondaryContainer');
            const thirdContainer = document.getElementById('catalogFieldThirdContainer');
            const fourthContainer = document.getElementById('catalogFieldFourthContainer');

            secContainer.classList.remove('hidden');
            thirdContainer.classList.add('hidden');
            fourthContainer.classList.add('hidden');
            const secWrapper = document.getElementById('inputSecondaryWrapper');

            if (type === 'Personal') {
                lblName.innerText = "Nombre Completo *";
                lblSec.innerText = "Cargo / Área";
                secWrapper.innerHTML = `<input type="text" id="catalogInputSecondary" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">`;
                thirdContainer.classList.remove('hidden');
                document.getElementById('catalogLabelThird').innerText = "Correo Electrónico";
            } else if (type === 'Estados') {
                lblName.innerText = "Nombre Estado *";
                lblSec.innerText = "Color de Estado";
                secWrapper.innerHTML = `
                    <input type="color" id="colorPickerSec" value="#3b82f6" class="w-12 h-10 p-1 border border-slate-200 rounded-xl cursor-pointer bg-white" onchange="document.getElementById('catalogInputSecondary').value = this.value">
                    <input type="text" id="catalogInputSecondary" value="#3b82f6" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" oninput="document.getElementById('colorPickerSec').value = this.value">
                `;
            } else if (type === 'Origenes') {
                lblName.innerText = "Tipo de Origen *";
                lblSec.innerText = "Descripción";
                secWrapper.innerHTML = `<input type="text" id="catalogInputSecondary" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">`;
            } else if (type === 'Alarmas') {
                lblName.innerText = "Nombre Alarma *";
                lblSec.innerText = "Días Mínimos";
                secWrapper.innerHTML = `<input type="number" id="catalogInputSecondary" value="0" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">`;
                thirdContainer.classList.remove('hidden');
                document.getElementById('catalogLabelThird').innerText = "Días Máximos";
                document.getElementById('catalogInputThird').value = "15";
                document.getElementById('catalogInputThird').type = "number";
                fourthContainer.classList.remove('hidden');
            }

            if (index !== null) {
                document.getElementById('catalogOldIndex').value = index;
                const item = appData[type][index];
                if (type === 'Personal') {
                    document.getElementById('catalogInputValue').value = getProp(item, ['Nombre_Completo', 'Nombre', 1]) || '';
                    document.getElementById('catalogInputSecondary').value = getProp(item, ['Cargo_Area', 'Cargo', 2]) || '';
                    document.getElementById('catalogInputThird').value = getProp(item, ['Correo_Electronico', 'Correo', 3]) || '';
                } else if (type === 'Estados') {
                    const col = getProp(item, ['Color_Hex', 'Color', 2]) || '#3b82f6';
                    document.getElementById('catalogInputValue').value = getProp(item, ['Nombre_Estado', 'Estado', 1]) || '';
                    document.getElementById('catalogInputSecondary').value = col;
                    const cp = document.getElementById('colorPickerSec');
                    if(cp) cp.value = col;
                } else if (type === 'Origenes') {
                    document.getElementById('catalogInputValue').value = getProp(item, ['Tipo_Origen', 'Origen', 1]) || '';
                    document.getElementById('catalogInputSecondary').value = getProp(item, ['Descripcion', 2]) || '';
                } else if (type === 'Alarmas') {
                    const col = getProp(item, ['Color_Hex', 4]) || '#ef4444';
                    document.getElementById('catalogInputValue').value = getProp(item, ['Nombre_Alarma', 1]) || '';
                    document.getElementById('catalogInputSecondary').value = getProp(item, ['Dias_Min', 2]) || 0;
                    document.getElementById('catalogInputThird').value = getProp(item, ['Dias_Max', 3]) || 15;
                    document.getElementById('catalogInputFourthText').value = col;
                    document.getElementById('catalogInputFourthColor').value = col;
                }
            } else {
                document.getElementById('catalogOldIndex').value = "";
            }
            document.getElementById('catalogModal').classList.remove('hidden');
        }

        function closeCatalogModal() { document.getElementById('catalogModal').classList.add('hidden'); }

        function saveCatalogItem(e) {
            e.preventDefault();
            const type = document.getElementById('catalogType').value;
            const val = document.getElementById('catalogInputValue').value.trim();
            const secondary = document.getElementById('catalogInputSecondary').value.trim();
            const third = document.getElementById('catalogInputThird').value.trim();
            const fourth = document.getElementById('catalogInputFourthText') ? document.getElementById('catalogInputFourthText').value.trim() : '';
            if (!val) return;

            const oldIndex = document.getElementById('catalogOldIndex').value;
            const oldVal = (oldIndex !== "" && appData[type][oldIndex]) ? 
                (typeof appData[type][oldIndex] === 'object' ? getProp(appData[type][oldIndex], ['Nombre_Completo', 'Nombre', 'Nombre_Estado', 'Tipo_Origen', 'Nombre_Alarma', 1]) : appData[type][oldIndex]) 
                : val;

            closeCatalogModal();
            executeGASAction({ 
                action: "saveCatalog", 
                type: type, 
                value: val, 
                oldValue: oldVal,
                secondary: secondary, 
                third: third, 
                fourth: fourth 
            });
        }

        function editCatalogItem(type, index) { openCatalogModal(type, index); }

        function deleteCatalogItem(type, index) {
            const item = appData[type][index];
            const val = typeof item === 'object' ? getProp(item, ['Nombre_Completo', 'Nombre', 'Nombre_Estado', 'Tipo_Origen', 'Nombre_Alarma', 1]) : item;
            if (confirm(`¿Eliminar '${val}' del catálogo ${type}?`)) {
                executeGASAction({ action: "deleteCatalog", type: type, value: val });
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-blue-600', 'text-blue-600', 'font-semibold');
                btn.classList.add('border-transparent', 'text-slate-500', 'font-medium');
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-btn-${tabId}`);
            activeBtn.classList.remove('border-transparent', 'text-slate-500', 'font-medium');
            activeBtn.classList.add('border-blue-600', 'text-blue-600', 'font-semibold');
            if (tabId === 'dashboard') renderCharts();
            if (tabId === 'catalogos') renderCatalogsManagement();
        }

        function renderCharts() {
            const estadosNombres = appData.Estados.map(e => typeof e === 'object' ? getProp(e, ['Nombre_Estado', 'Estado', 1]) : e).filter(Boolean);
            const origenesNombres = appData.Origenes.map(o => typeof o === 'object' ? getProp(o, ['Tipo_Origen', 'Origen', 1]) : o).filter(Boolean);
            const estadoCounts = {}; estadosNombres.forEach(e => estadoCounts[e] = 0);
            appData.Documentos.forEach(doc => { const est = getProp(doc, ['Estado', 9]) || 'Otros'; estadoCounts[est] = (estadoCounts[est] || 0) + 1; });
            const origenCounts = {}; origenesNombres.forEach(o => origenCounts[o] = 0);
            appData.Documentos.forEach(doc => { const orig = getProp(doc, ['Origen_Tipo', 2]) || 'Otros'; origenCounts[orig] = (origenCounts[orig] || 0) + 1; });

            if (chartsInstance.estados) chartsInstance.estados.destroy();
            if (chartsInstance.origenes) chartsInstance.origenes.destroy();

            chartsInstance.estados = new Chart(document.getElementById('chartEstados').getContext('2d'), {
                type: 'doughnut',
                data: { labels: Object.keys(estadoCounts), datasets: [{ data: Object.values(estadoCounts), backgroundColor: ['#3b82f6', '#f59e0b', '#10b981', '#6366f1', '#ec4899'] }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
            chartsInstance.origenes = new Chart(document.getElementById('chartOrigenes').getContext('2d'), {
                type: 'bar',
                data: { labels: Object.keys(origenCounts), datasets: [{ label: 'Documentos', data: Object.values(origenCounts), backgroundColor: '#3b82f6', borderRadius: 8 }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });
        }

        function openConfigModal() { document.getElementById('inputBackendUrl').value = getBackendUrl(); document.getElementById('configModal').classList.remove('hidden'); }
        function closeConfigModal() { document.getElementById('configModal').classList.add('hidden'); }
        function saveBackendUrl() {
            const url = document.getElementById('inputBackendUrl').value.trim();
            if (url) { localStorage.setItem('hidrandina_gas_url', url); closeConfigModal(); fetchData(); }
        }
    </script>
