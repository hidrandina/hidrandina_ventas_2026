<script>
    const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbwqYwIBI4AkNpNGXF1QhYUw1kthGGx0tVQOZsHHT5KwovDx_5S6z_ESaO8Eb80gaBiO/exec";

    function getBackendUrl() {
        return localStorage.getItem('hidrandina_gas_url') || DEFAULT_GAS_URL;
    }

    let appData = {
        Documentos: [],
        Personal: [],
        Estados: [],
        Origenes: [],
        Alarmas: []
    };

    let currentUser = null;
    let chartsInstance = { estados: null, origenes: null };

    document.addEventListener('DOMContentLoaded', () => {
        loadLocalCache();
        checkSession();
        fetchData();
    });

    function checkSession() {
        const savedUser = localStorage.getItem('hidrandina_current_user');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('userSessionBadge').innerText = `${currentUser.nombre} (${currentUser.tipo})`;
            document.getElementById('userSessionBadge').classList.remove('hidden');
            applyUserPermissions();
        } else {
            document.getElementById('loginModal').classList.remove('hidden');
        }
    }

    function applyUserPermissions() {
        if (!currentUser) return;
        const isVisita = currentUser.tipo === 'Visita';
        const isAdmin = currentUser.tipo === 'Administrador';

        const btnNuevoDoc = document.getElementById('btnNuevoDocHeader');
        if (btnNuevoDoc) btnNuevoDoc.style.display = isVisita ? 'none' : 'inline-flex';

        const btnConfig = document.getElementById('btnConfigAppsScript');
        if (btnConfig) btnConfig.style.display = isAdmin ? 'inline-flex' : 'none';

        ['btnAñadirPersonal', 'btnAñadirEstados', 'btnAñadirOrigenes', 'btnAñadirAlarmas'].forEach(btnId => {
            const btn = document.getElementById(btnId);
            if (btn) btn.style.display = isAdmin ? 'inline-flex' : 'none';
        });
    }

    function toggleLoginPassword() {
        const input = document.getElementById('loginClave');
        const icon = document.getElementById('loginEyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fa-solid fa-eye';
        } else {
            input.type = 'password';
            icon.className = 'fa-solid fa-eye-slash';
        }
    }

    function toggleModalPassword() {
        const input = document.getElementById('catalogInputClave');
        const icon = document.getElementById('modalEyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fa-solid fa-eye';
        } else {
            input.type = 'password';
            icon.className = 'fa-solid fa-eye-slash';
        }
    }

    function toggleRowPassword(idx) {
        if (!currentUser || currentUser.tipo !== 'Administrador') return;

        const span = document.getElementById(`pwd_text_${idx}`);
        const icon = document.getElementById(`pwd_icon_${idx}`);
        const realPwd = span.getAttribute('data-pwd');
        const isMasked = span.getAttribute('data-masked') === 'true';

        if (isMasked) {
            span.innerText = realPwd;
            span.setAttribute('data-masked', 'false');
            icon.className = 'fa-solid fa-eye-slash text-xs text-blue-600';
        } else {
            span.innerText = '••••••';
            span.setAttribute('data-masked', 'true');
            icon.className = 'fa-solid fa-eye text-xs text-slate-400';
        }
    }

    function handleLogin(e) {
        e.preventDefault();
        const uInput = document.getElementById('loginUsuario').value.trim();
        const cInput = document.getElementById('loginClave').value.trim();

        if (uInput === 'jcamachom' && cInput === '9314040') {
            currentUser = { nombre: 'Johnny Camacho Mori', usuario: 'jcamachom', tipo: 'Administrador' };
            localStorage.setItem('hidrandina_current_user', JSON.stringify(currentUser));
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('userSessionBadge').innerText = `${currentUser.nombre} (${currentUser.tipo})`;
            document.getElementById('userSessionBadge').classList.remove('hidden');
            applyUserPermissions();
            fetchData();
            return;
        }

        const encontrado = appData.Personal.find(p => {
            const usu = String(typeof p === 'object' ? (p.usuario || p.Usuario || p[4] || '') : '').trim();
            const cla = String(typeof p === 'object' ? (p.clave || p.Clave || p[5] || '') : '').trim();
            return usu.toLowerCase() === uInput.toLowerCase() && cla === cInput;
        });

        if (encontrado) {
            const nombre = typeof encontrado === 'object' ? (encontrado.Nombre_Completo || encontrado.Nombre || encontrado[1] || 'Usuario') : 'Usuario';
            const tipo = typeof encontrado === 'object' ? (encontrado.tipo_usuario || encontrado.Tipo_Usuario || encontrado[6] || 'Operador') : 'Operador';
            currentUser = { nombre, usuario: uInput, tipo };
            localStorage.setItem('hidrandina_current_user', JSON.stringify(currentUser));
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('userSessionBadge').innerText = `${currentUser.nombre} (${currentUser.tipo})`;
            document.getElementById('userSessionBadge').classList.remove('hidden');
            applyUserPermissions();
            fetchData();
        } else {
            alert("Usuario o clave incorrectos.");
        }
    }

    function logoutSession() {
        localStorage.removeItem('hidrandina_current_user');
        currentUser = null;
        document.getElementById('loginModal').classList.remove('hidden');
        document.getElementById('loginUsuario').value = '';
        document.getElementById('loginClave').value = '';
    }

    function loadLocalCache() {
        if (localStorage.getItem('hidrandina_docs_cache')) appData.Documentos = JSON.parse(localStorage.getItem('hidrandina_docs_cache'));
        if (localStorage.getItem('hidrandina_pers_cache')) appData.Personal = JSON.parse(localStorage.getItem('hidrandina_pers_cache'));
        if (localStorage.getItem('hidrandina_esta_cache')) appData.Estados = JSON.parse(localStorage.getItem('hidrandina_esta_cache'));
        if (localStorage.getItem('hidrandina_orig_cache')) appData.Origenes = JSON.parse(localStorage.getItem('hidrandina_orig_cache'));
        if (localStorage.getItem('hidrandina_alar_cache')) appData.Alarmas = JSON.parse(localStorage.getItem('hidrandina_alar_cache'));
        if (appData.Documentos.length > 0) renderAll();
    }

    function saveLocalCache() {
        localStorage.setItem('hidrandina_docs_cache', JSON.stringify(appData.Documentos));
        localStorage.setItem('hidrandina_pers_cache', JSON.stringify(appData.Personal));
        localStorage.setItem('hidrandina_esta_cache', JSON.stringify(appData.Estados));
        localStorage.setItem('hidrandina_orig_cache', JSON.stringify(appData.Origenes));
        localStorage.setItem('hidrandina_alar_cache', JSON.stringify(appData.Alarmas));
    }

    function setConnectionStatus(status, text) {
        const badge = document.getElementById('connection-badge');
        if (status === 'active') {
            badge.className = "inline-flex items-center px-2.5 py-0.5 rounded-full font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 backdrop-blur-md";
            badge.innerHTML = `<span class="w-2 h-2 mr-1.5 rounded-full bg-emerald-400"></span> ${text}`;
        } else if (status === 'error') {
            badge.className = "inline-flex items-center px-2.5 py-0.5 rounded-full font-semibold bg-rose-500/20 text-rose-300 border border-rose-400/30 backdrop-blur-md";
            badge.innerHTML = `<span class="w-2 h-2 mr-1.5 rounded-full bg-rose-400"></span> ${text}`;
        } else {
            badge.className = "inline-flex items-center px-2.5 py-0.5 rounded-full font-semibold bg-amber-500/20 text-amber-300 border border-amber-400/30 backdrop-blur-md";
            badge.innerHTML = `<span class="w-2 h-2 mr-1.5 rounded-full bg-amber-400 animate-ping"></span> ${text}`;
        }
    }

    function getProp(obj, keys) {
        if (!obj) return '';
        if (typeof obj !== 'object') return obj;
        for (let k of keys) {
            if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k];
        }
        return '';
    }

    window.handleGASResponse = function(data) {
        if (data && data.success) {
            if (data.Registros) appData.Documentos = data.Registros;
            if (data.Catalogos) {
                appData.Personal = data.Catalogos.Personal || appData.Personal;
                appData.Estados = data.Catalogos.Estados || appData.Estados;
                appData.Origenes = data.Catalogos.Origenes || appData.Origenes;
                appData.Alarmas = data.Catalogos.Alarmas || appData.Alarmas;
            }
            saveLocalCache();
            setConnectionStatus('active', 'Sincronizado');
            renderAll();
        }
    };

    function fetchData() {
        setConnectionStatus('sync', 'Conectando...');
        const url = getBackendUrl();
        const oldScript = document.getElementById('jsonp-fetch');
        if (oldScript) oldScript.remove();

        const script = document.createElement('script');
        script.id = 'jsonp-fetch';
        script.src = `${url}?callback=handleGASResponse&_=${new Date().getTime()}`;
        script.onerror = () => { setConnectionStatus('error', 'Offline'); renderAll(); };
        document.body.appendChild(script);
    }

    // Comunicación segura POST para envío de datos y archivos grandes
    async function executeGASActionPost(payload, successCallback) {
        setConnectionStatus('sync', 'Guardando en la Nube...');
        const url = getBackendUrl();
        try {
            const response = await fetch(url, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            if (result && result.success) {
                setConnectionStatus('active', 'Sincronizado');
                if (successCallback) successCallback();
                setTimeout(fetchData, 800);
            } else {
                setConnectionStatus('error', 'Error al guardar');
                alert("Aviso del Servidor: " + (result ? result.message : "Error desconocido"));
            }
        } catch (err) {
            setConnectionStatus('error', 'Error de Conexión');
            alert("No se pudo conectar con el servidor de Google Apps Script.");
        }
    }

    function renderAll() {
        renderTable(appData.Documentos);
        populateSelects();
        renderStatsAndCharts();
        renderCatalogsManagement();
        applyUserPermissions();
    }

    function calcularPlazos(fechaIngresoStr, fechaVencimientoStr) {
        const cleanIngresoStr = String(fechaIngresoStr || '').split('T')[0];
        const ingreso = new Date(cleanIngresoStr + 'T00:00:00');
        const hoy = new Date();
        hoy.setHours(0, 0, 0, 0);

        let diasTranscurridos = 0;
        if (!isNaN(ingreso.getTime())) {
            const diffTime = hoy - ingreso;
            diasTranscurridos = Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));
        }

        let vencimientoDate = null;
        const cleanVencStr = String(fechaVencimientoStr || '').split('T')[0];
        if (cleanVencStr) vencimientoDate = new Date(cleanVencStr + 'T00:00:00');

        if (!vencimientoDate || isNaN(vencimientoDate.getTime())) {
            vencimientoDate = new Date(ingreso);
            vencimientoDate.setDate(vencimientoDate.getDate() + 15);
        }
        vencimientoDate.setHours(0, 0, 0, 0);
        const vencimientoFormatted = vencimientoDate.toISOString().split('T')[0];

        const diffVenc = vencimientoDate - hoy;
        const diasFaltantes = Math.max(0, Math.ceil(diffVenc / (1000 * 60 * 60 * 24)));
        const diffExc = hoy - vencimientoDate;
        const diasExceso = Math.max(0, Math.floor(diffExc / (1000 * 60 * 60 * 24)));

        return { vencimiento: vencimientoFormatted, diasTranscurridos, diasFaltantes, diasExceso };
    }

    function obtenerDocumentosFiltradosActuales() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const personal = document.getElementById('filterPersonal').value;
        const estado = document.getElementById('filterEstado').value;
        const origen = document.getElementById('filterOrigen').value;

        return appData.Documentos.filter(doc => {
            const numDoc = String(getProp(doc, ['Numero_Documento', 'Numero_Expediente', 1]) || '').toLowerCase();
            const asunto = String(getProp(doc, ['Asunto', 3]) || '').toLowerCase();
            const resp = String(getProp(doc, ['Responsable', 8]) || '');
            const docEstado = String(getProp(doc, ['Estado', 9]) || '');
            const docOrigen = String(getProp(doc, ['Origen_Tipo', 2]) || '');
            
            return (numDoc.includes(query) || asunto.includes(query) || resp.toLowerCase().includes(query)) && 
                   (!personal || resp === personal) && 
                   (!estado || docEstado === estado) && 
                   (!origen || docOrigen === origen);
        });
    }

    function obtenerDocumentosDashboardFiltrados() {
        const fInicio = document.getElementById('dashFechaInicio').value;
        const fFin = document.getElementById('dashFechaFin').value;
        const pers = document.getElementById('dashFiltroPersonal').value;
        const orig = document.getElementById('dashFiltroOrigen').value;
        const est = document.getElementById('dashFiltroEstado').value;
        const alar = document.getElementById('dashFiltroAlarma').value;

        return appData.Documentos.filter(doc => {
            const fechaIng = String(getProp(doc, ['Fecha_Ingreso', 4]) || '').split('T')[0];
            if (fInicio && fechaIng && fechaIng < fInicio) return false;
            if (fFin && fechaIng && fechaIng > fFin) return false;

            const docResp = String(getProp(doc, ['Responsable', 8]) || '');
            if (pers && docResp !== pers) return false;

            const docOrig = String(getProp(doc, ['Origen_Tipo', 2]) || '');
            if (orig && docOrig !== orig) return false;

            const docEst = String(getProp(doc, ['Estado', 9]) || '');
            if (est && docEst !== est) return false;

            if (alar) {
                const fechaVencRaw = getProp(doc, ['Fecha_Vencimiento', 5]);
                const plazos = calcularPlazos(fechaIng, fechaVencRaw);
                const dTrans = plazos.diasTranscurridos;
                const alarmaObj = appData.Alarmas.find(a => {
                    const nom = typeof a === 'object' ? (a.Nombre_Alarma || a[1] || '') : a;
                    return nom === alar;
                });
                if (alarmaObj && typeof alarmaObj === 'object') {
                    const dMin = parseInt(alarmaObj.Dias_Min || alarmaObj[2] || 0);
                    const dMax = parseInt(alarmaObj.Dias_Max || alarmaObj[3] || 9999);
                    if (dTrans < dMin || dTrans > dMax) return false;
                }
            }
            return true;
        });
    }

    function resetDashboardFilters() {
        document.getElementById('dashFechaInicio').value = '';
        document.getElementById('dashFechaFin').value = '';
        document.getElementById('dashFiltroPersonal').value = '';
        document.getElementById('dashFiltroOrigen').value = '';
        document.getElementById('dashFiltroEstado').value = '';
        document.getElementById('dashFiltroAlarma').value = '';
        renderCharts();
    }

    function exportarExcel() {
        const docs = obtenerDocumentosFiltradosActuales();
        if (!docs || docs.length === 0) { alert("No hay registros para exportar."); return; }

        const datosFormateados = docs.map(doc => {
            const fechaIngRaw = getProp(doc, ['Fecha_Ingreso', 4]) || '';
            const fechaVencRaw = getProp(doc, ['Fecha_Vencimiento', 5]) || '';
            const plazos = calcularPlazos(fechaIngRaw, fechaVencRaw);
            return {
                "Nro. Documento": getProp(doc, ['Numero_Documento', 1]) || '-',
                "Origen": getProp(doc, ['Origen_Tipo', 2]) || '-',
                "Asunto": getProp(doc, ['Asunto', 3]) || '-',
                "Fecha Ingreso": fechaIngRaw ? String(fechaIngRaw).split('T')[0] : '-',
                "Fecha Vencimiento": plazos.vencimiento,
                "Días Transcurridos": plazos.diasTranscurridos,
                "Días Faltantes": plazos.diasFaltantes,
                "Días Exceso": plazos.diasExceso,
                "Responsable": getProp(doc, ['Responsable', 8]) || '-',
                "Estado": getProp(doc, ['Estado', 9]) || 'Pendiente',
                "Urls Sustento": getProp(doc, ['Urls_Ingreso', 11]) || '-',
                "Urls Cierre": getProp(doc, ['Urls_Cierre', 12]) || '-',
                "Observaciones": getProp(doc, ['Observaciones', 10]) || '-'
            };
        });

        const worksheet = XLSX.utils.json_to_sheet(datosFormateados);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Documentos Hidrandina");
        XLSX.writeFile(workbook, "Control_Documentos_Hidrandina.xlsx");
    }

    function enviarListaCorreo() {
        const docs = obtenerDocumentosFiltradosActuales();
        if (!docs || docs.length === 0) { alert("No hay registros en la lista para enviar."); return; }
        exportarExcel();
        const asunto = encodeURIComponent("REPORTE GENERAL: Control de Documentos - Hidrandina (Ventas y Clientes Menores)");
        let cuerpo = `Estimado equipo,\n\nSe adjunta el reporte actual de control de documentos en formato Excel para su revisión y atención.\n\nAtte,\nIng. Johnny Quevin Camacho Mori`;
        alert("¡Reporte Excel descargado con éxito!\n\nPor favor, adjunta el archivo 'Control_Documentos_Hidrandina.xlsx' en tu gestor de correo.");
        window.location.href = `mailto:?subject=${asunto}&body=${encodeURIComponent(cuerpo)}`;
    }

    function enviarCorreoIndividual(idx) {
        const doc = appData.Documentos[idx];
        if (!doc) return;
        const numDoc = getProp(doc, ['Numero_Documento', 1]) || 'DOC';
        const entidad = getProp(doc, ['Origen_Tipo', 2]) || 'Entidad';
        const estado = getProp(doc, ['Estado', 9]) || 'Pendiente';
        const responsableNombre = getProp(doc, ['Responsable', 8]) || '';
        const asuntoDoc = getProp(doc, ['Asunto', 3]) || '';
        const fechaIng = String(getProp(doc, ['Fecha_Ingreso', 4]) || '').split('T')[0];
        const observaciones = getProp(doc, ['Observaciones', 10]) || '';

        let correoDestino = '';
        if (appData.Personal && appData.Personal.length > 0) {
            const persEncontrado = appData.Personal.find(p => {
                const nom = typeof p === 'object' ? (p.Nombre_Completo || p.Nombre || p[1] || '') : p;
                return nom.toLowerCase() === responsableNombre.toLowerCase();
            });
            if (persEncontrado && typeof persEncontrado === 'object') {
                correoDestino = persEncontrado.Correo_Electronico || persEncontrado.Correo || persEncontrado[3] || '';
            }
        }

        const asuntoCorreo = encodeURIComponent(`${numDoc} - ${entidad} - ${estado}`);
        let cuerpoCorreo = `Estimado(a) ${responsableNombre},\n\nSe remite el siguiente documento para su conocimiento:\n\n` +
            `- Nro. Documento: ${numDoc}\n- Entidad / Origen: ${entidad}\n- Asunto: ${asuntoDoc}\n` +
            `- Fecha de Ingreso: ${fechaIng}\n- Estado Actual: ${estado}\n- Observaciones: ${observaciones}\n`;

        window.location.href = `mailto:${correoDestino}?subject=${asuntoCorreo}&body=${encodeURIComponent(cuerpoCorreo)}`;
    }

    function renderTable(docs) {
        const tbody = document.getElementById('documentosTableBody');
        if (!docs || docs.length === 0) {
            tbody.innerHTML = `<tr><td colspan="13" class="py-12 text-center text-slate-400 font-semibold bg-white">Sin documentos registrados.</td></tr>`;
            return;
        }

        const isVisita = currentUser && currentUser.tipo === 'Visita';
        const isAsistente = currentUser && currentUser.tipo === 'Asistente';
        const isAdmin = currentUser && currentUser.tipo === 'Administrador';
        const isOperador = currentUser && currentUser.tipo === 'Operador';

        tbody.innerHTML = docs.map((doc, idx) => {
            const numDoc = getProp(doc, ['Numero_Documento', 1]) || '-';
            const origen = getProp(doc, ['Origen_Tipo', 2]) || '-';
            const asunto = getProp(doc, ['Asunto', 3]) || '-';
            const fechaIngRaw = getProp(doc, ['Fecha_Ingreso', 4]) || '';
            const fechaIng = fechaIngRaw ? String(fechaIngRaw).split('T')[0] : '-';

            const rawVenc = getProp(doc, ['Fecha_Vencimiento', 5]);
            const plazos = calcularPlazos(fechaIng, rawVenc);
            const fechaVenc = plazos.vencimiento;
            const diasTrans = plazos.diasTranscurridos;
            const diasFalt = plazos.diasFaltantes;
            const diasExc = plazos.diasExceso;

            const responsable = getProp(doc, ['Responsable', 8]) || '-';
            const rawEstado = getProp(doc, ['Estado', 9]) || 'Pendiente';
            
            let estadoColor = '#3b82f6';
            if (appData.Estados && appData.Estados.length > 0) {
                const estObj = appData.Estados.find(e => {
                    const nom = typeof e === 'object' ? (e.Nombre_Estado || e[1] || '') : e;
                    return nom.toLowerCase() === String(rawEstado).toLowerCase();
                });
                if (estObj && typeof estObj === 'object') estadoColor = estObj.Color_Hex || estObj[2] || '#3b82f6';
            }

            const urlsIngreso = getProp(doc, ['Urls_Ingreso', 11]) || '';
            const urlsCierre = getProp(doc, ['Urls_Cierre', 12]) || '';
            
            let linksHtml = '<div class="space-y-1 text-[11px]">';
            if (urlsIngreso) {
                linksHtml += `<div class="font-bold text-blue-700"><i class="fa-solid fa-folder-open mr-1"></i>Sustento: <a href="${urlsIngreso.split(',')[0].trim()}" target="_blank" class="underline text-blue-600 hover:text-blue-800">Ver Archivo</a></div>`;
            }
            if (urlsCierre) {
                linksHtml += `<div class="font-bold text-emerald-700"><i class="fa-solid fa-circle-check mr-1"></i>Cierre: <a href="${urlsCierre.split(',')[0].trim()}" target="_blank" class="underline text-emerald-600 hover:text-emerald-800">Ver Archivo</a></div>`;
            }
            if (!urlsIngreso && !urlsCierre) {
                linksHtml = '<span class="text-slate-400">Sin archivos</span>';
            } else {
                linksHtml += '</div>';
            }

            const observaciones = getProp(doc, ['Observaciones', 10]) || '-';
            const bgRow = idx % 2 === 0 ? 'bg-white' : 'bg-slate-50/70';

            const canEditOrDelete = !isVisita && (isAdmin || isAsistente || (isOperador && (responsable.toLowerCase() === currentUser.nombre.toLowerCase())));

            return `
                <tr class="${bgRow} hover:bg-blue-50/60 transition duration-150">
                    <td class="py-3.5 px-4 font-extrabold text-blue-900 border-r border-slate-200/80">${numDoc}</td>
                    <td class="py-3.5 px-4 border-r border-slate-200/80"><span class="px-2.5 py-1 rounded-md text-[10px] font-extrabold bg-blue-100/70 text-blue-800 border border-blue-200/50">${origen}</span></td>
                    <td class="py-3.5 px-4 text-slate-800 max-w-[200px] truncate font-medium border-r border-slate-200/80" title="${asunto}">${asunto}</td>
                    <td class="py-3.5 px-4 text-slate-600 font-semibold border-r border-slate-200/80">${fechaIng}</td>
                    <td class="py-3.5 px-4 font-bold text-slate-700 border-r border-slate-200/80">${fechaVenc}</td>
                    <td class="py-3.5 px-4 text-center border-r border-slate-200/80"><span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 font-bold text-[11px] border border-slate-200">${diasTrans}</span></td>
                    <td class="py-3.5 px-4 text-center border-r border-slate-200/80">
                        ${diasFalt > 0 ? `<span class="px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-700 font-extrabold text-[11px] border border-emerald-200">${diasFalt}</span>` : `<span class="text-slate-400 font-semibold text-[11px]">0</span>`}
                    </td>
                    <td class="py-3.5 px-4 text-center border-r border-slate-200/80">
                        ${diasExc > 0 ? `<span class="px-2.5 py-1 rounded-lg bg-rose-500 text-white font-black text-[11px] shadow-sm shadow-rose-500/30 animate-pulse">+${diasExc}</span>` : `<span class="text-emerald-600 font-extrabold text-[11px]">0</span>`}

    async function convertirArchivosABase64(inputElement) {
        if (!inputElement || !inputElement.files || inputElement.files.length === 0) return [];
        let promesas = Array.from(inputElement.files).map(file => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64String = reader.result.split(',')[1];
                    resolve({ name: file.name, mimeType: file.type || 'application/octet-stream', data: base64String });
                };
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        });
        return await Promise.all(promesas);
    }

    async function saveDocument(e) {
        e.preventDefault();
        setConnectionStatus('sync', 'Preparando archivos...');

        const inputIngreso = document.getElementById('inputArchivosIngreso');
        const inputCierre = document.getElementById('inputArchivosCierre');

        const archivosIngresoArr = !inputIngreso.disabled ? await convertirArchivosABase64(inputIngreso) : [];
        const archivosCierreArr = !inputCierre.disabled ? await convertirArchivosABase64(inputCierre) : [];

        const numDoc = document.getElementById('formNumeroDocumento').value.trim();
        const fechaIng = document.getElementById('formFechaIngreso').value;
        const fechaVenc = document.getElementById('formFechaVencimiento').value;
        const origenTipo = document.getElementById('formOrigenTipo').value;
        const asunto = document.getElementById('formAsunto').value;
        const resp = document.getElementById('formResponsable').value;
        const est = document.getElementById('formEstado').value;
        const obs = document.getElementById('formObservaciones').value;
        const plazos = calcularPlazos(fechaIng, fechaVenc);

        const idx = document.getElementById('docIndex').value;

        const payload = {
            action: "saveDoc",
            Numero_Documento: numDoc,
            Origen_Tipo: origenTipo,
            Asunto: asunto,
            Fecha_Ingreso: fechaIng,
            Fecha_Vencimiento: fechaVenc || plazos.vencimiento,
            Dias_Trancurridos: plazos.diasTranscurridos,
            Dias_Exceso: plazos.diasExceso,
            Responsable: resp,
            Estado: est,
            Observaciones: obs,
            Archivos_Ingreso: archivosIngresoArr,
            Archivos_Cierre: archivosCierreArr
        };

        if (idx !== "") appData.Documentos[idx] = payload;
        else appData.Documentos.push(payload);

        saveLocalCache();
        renderAll();
        closeDocFormModal();
        await executeGASActionPost(payload);
    }

            lblName.innerText = "Tipo de Origen *";
            lblSec.innerText = "Descripción";
            secWrapper.innerHTML = `<input type="text" id="catalogInputSecondary" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white focus:outline-none transition shadow-inner font-semibold">`;
        } else if (type === 'Alarmas') {
            lblName.innerText = "Nombre Alarma *";
            lblSec.innerText = "Días Mínimos";
            secWrapper.innerHTML = `<input type="number" id="catalogInputSecondary" value="0" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white focus:outline-none transition shadow-inner font-semibold">`;
            thirdContainer.classList.remove('hidden');
            document.getElementById('catalogLabelThird').innerText = "Días Máximos";
            document.getElementById('catalogInputThird').value = "15";
            document.getElementById('catalogInputThird').type = "number";
            fourthContainer.classList.remove('hidden');
        }

        if (index !== null) {
            document.getElementById('catalogOldIndex').value = index;
            const item = appData[type][index];
            if (type === 'Personal') {
                document.getElementById('catalogInputValue').value = getProp(item, ['Nombre_Completo', 'Nombre', 1]) || '';
                document.getElementById('catalogInputSecondary').value = getProp(item, ['Cargo_Area', 'Cargo', 2]) || '';
                document.getElementById('catalogInputThird').value = getProp(item, ['Correo_Electronico', 'Correo', 3]) || '';
                document.getElementById('catalogInputUsuario').value = getProp(item, ['usuario', 'Usuario', 4]) || '';
                document.getElementById('catalogInputClave').value = getProp(item, ['clave', 'Clave', 5]) || '';
                document.getElementById('catalogInputTipoUsuario').value = getProp(item, ['tipo_usuario', 'Tipo_Usuario', 6]) || 'Operador';
            } else if (type === 'Estados') {
                const col = getProp(item, ['Color_Hex', 2]) || '#3b82f6';
                document.getElementById('catalogInputValue').value = getProp(item, ['Nombre_Estado', 1]) || '';
                document.getElementById('catalogInputFourthText').value = col;
                document.getElementById('catalogInputFourthColor').value = col;
            } else if (type === 'Origenes') {
                document.getElementById('catalogInputValue').value = getProp(item, ['Tipo_Origen', 1]) || '';
                document.getElementById('catalogInputSecondary').value = getProp(item, ['Descripcion', 2]) || '';
            } else if (type === 'Alarmas') {
                const col = getProp(item, ['Color_Hex', 4]) || '#ef4444';
                document.getElementById('catalogInputValue').value = getProp(item, ['Nombre_Alarma', 1]) || '';
                document.getElementById('catalogInputSecondary').value = getProp(item, ['Dias_Min', 2]) || 0;
                document.getElementById('catalogInputThird').value = getProp(item, ['Dias_Max', 3]) || 15;
                document.getElementById('catalogInputFourthText').value = col;
                document.getElementById('catalogInputFourthColor').value = col;
            }
        } else {
            document.getElementById('catalogOldIndex').value = "";
        }
        document.getElementById('catalogModal').classList.remove('hidden');
    }

    function closeCatalogModal() { document.getElementById('catalogModal').classList.add('hidden'); }

    function saveCatalogItem(e) {
        e.preventDefault();
        const type = document.getElementById('catalogType').value;
        const val = document.getElementById('catalogInputValue').value.trim();
        const secondary = document.getElementById('catalogInputSecondary') ? document.getElementById('catalogInputSecondary').value.trim() : '';
        const third = document.getElementById('catalogInputThird').value.trim();
        const fourth = document.getElementById('catalogInputFourthText') ? document.getElementById('catalogInputFourthText').value.trim() : '';
        const usuario = document.getElementById('catalogInputUsuario') ? document.getElementById('catalogInputUsuario').value.trim() : '';
        const clave = document.getElementById('catalogInputClave') ? document.getElementById('catalogInputClave').value.trim() : '';
        const tipo_usuario = document.getElementById('catalogInputTipoUsuario') ? document.getElementById('catalogInputTipoUsuario').value.trim() : '';
        if (!val) return;

        const oldIndex = document.getElementById('catalogOldIndex').value;
        const oldVal = (oldIndex !== "" && appData[type][oldIndex]) ? 
            (typeof appData[type][oldIndex] === 'object' ? getProp(appData[type][oldIndex], ['Nombre_Completo', 'Nombre_Estado', 'Tipo_Origen', 'Nombre_Alarma', 1]) : appData[type][oldIndex]) 
            : val;

        closeCatalogModal();
        executeGASActionPost({ 
            action: "saveCatalog", 
            type: type, 
            value: val, 
            oldValue: oldVal,
            secondary: type === 'Estados' ? fourth : secondary, 
            third: third, 
            fourth: fourth,
            usuario: usuario,
            clave: clave,
            tipo_usuario: tipo_usuario
        });
    }

    function editCatalogItem(type, index) { openCatalogModal(type, index); }

    function deleteCatalogItem(type, index) {
        const item = appData[type][index];
        const val = typeof item === 'object' ? getProp(item, ['Nombre_Completo', 'Nombre_Estado', 'Tipo_Origen', 'Nombre_Alarma', 1]) : item;
        if (confirm(`¿Eliminar '${val}' del catálogo ${type}?`)) {
            executeGASActionPost({ action: "deleteCatalog", type: type, value: val });
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('border-blue-600', 'text-blue-600', 'font-extrabold');
            btn.classList.add('border-transparent', 'text-slate-500', 'font-bold');
        });
        document.getElementById(`tab-${tabId}`).classList.remove('hidden');
        const activeBtn = document.getElementById(`tab-btn-${tabId}`);
        activeBtn.classList.remove('border-transparent', 'text-slate-500', 'font-bold');
        activeBtn.classList.add('border-blue-600', 'text-blue-600', 'font-extrabold');
        if (tabId === 'dashboard') renderStatsAndCharts();
        if (tabId === 'catalogos') renderCatalogsManagement();
    }

    function openConfigModal() { 
        if (!currentUser || currentUser.tipo !== 'Administrador') {
            alert("Acceso denegado. Solo el Administrador puede configurar Apps Script.");
            return;
        }
        document.getElementById('inputBackendUrl').value = getBackendUrl(); 
        document.getElementById('configModal').classList.remove('hidden'); 
    }

    function closeConfigModal() { document.getElementById('configModal').classList.add('hidden'); }

    function saveBackendUrl() {
        const url = document.getElementById('inputBackendUrl').value.trim();
        if (url) { localStorage.setItem('hidrandina_gas_url', url); closeConfigModal(); fetchData(); }
    }
</script>
